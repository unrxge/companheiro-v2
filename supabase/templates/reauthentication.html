<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light only">
<title>Confirm it’s you</title>
</head>
<body style="margin:0;padding:0;background:#f6f4ef;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">Your verification code.</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f6f4ef;">
  <tr><td align="center" style="padding:40px 16px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;">
      <tr><td style="padding:0 4px 20px;font-family:Georgia,'Times New Roman',serif;font-size:20px;color:#111110;letter-spacing:0.2px;">Companheiro</td></tr>
      <tr><td style="background:#ffffff;border:1px solid #e8e5de;border-radius:18px;padding:36px 32px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
          <tr><td style="font-size:22px;line-height:1.3;font-weight:600;color:#111110;padding-bottom:14px;">Confirm it's you</td></tr>
          <tr><td style="font-size:15px;line-height:1.65;color:#3d3b37;padding-bottom:22px;">Enter this code in Companheiro to continue with the change you started:</td></tr>
          <tr><td style="padding:8px 0 28px;">
            <div style="display:inline-block;font-family:'SFMono-Regular',Menlo,Consolas,monospace;font-size:28px;letter-spacing:8px;font-weight:600;color:#111110;background:#f3f1ec;border:1px solid #e4e1da;border-radius:12px;padding:14px 22px;">{{ .Token }}</div>
          </td></tr>
          <tr><td style="border-top:1px solid #eeebe4;padding-top:18px;font-size:13px;line-height:1.6;color:#8a8780;">The code expires soon. If you didn't request it, someone may know your password — change it when you can.</td></tr>
        </table>
      </td></tr>
      <tr><td style="padding:20px 4px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;line-height:1.6;color:#9a978f;">
        Sent by Companheiro · <a href="{{ .SiteURL }}" style="color:#9a978f;">companheiro.app</a>
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
